name: publish
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [app, db, redis, clickhouse, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/bon5co/grovs-railway-${{ matrix.role }}:3.0.1
            ghcr.io/bon5co/grovs-railway-${{ matrix.role }}:latest
